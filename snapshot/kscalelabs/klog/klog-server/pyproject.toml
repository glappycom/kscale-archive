[project]
name = "klog-server"
version = "0.1.0"
description = "A server for logging and replaying klogs"
authors = [
    { name = "AJ Williams", email = "aj@kscale.dev" }, # Placeholder, please update
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["klog", "logging", "server"]


dependencies = [
    "rerun-sdk==0.24.0",
    "urdfpy==0.0.22",
    "puid-py==1.2.0",
    "colorlogging==0.0.2",
    "kscale==0.3.17",
    "numpy==2.3.2",
    "pytz==2025.2",
    "trimesh==4.7.1",
    "pyyaml==6.0.2",
    "watchdog==6.0.0",
    "kinfer==0.5.5",
    "paho.mqtt==2.1.0"
]

[project.optional-dependencies]
dev = [
    "black",
    "darglint",
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
klog-server = "klog_server.main:main"
klog-postprocess = "klog_server.make_rerun:main"

[tool.pytest.ini_options]

addopts = "-rx -rf -x -q --full-trace"
testpaths = ["tests"]

markers = [
    "slow: Marks test as being slow",
]

[tool.mypy]

pretty = true
show_column_numbers = true
show_error_context = true
show_error_codes = true
show_traceback = true
disallow_untyped_defs = true
strict_equality = true
allow_redefinition = true

warn_unused_ignores = true
warn_redundant_casts = true

incremental = true
namespace_packages = false

# Uncomment to exclude modules from Mypy.
[[tool.mypy.overrides]]
module = [
    "urdfpy.*",
    "puid.*",
]
ignore_missing_imports = true

[tool.ruff]

line-length = 120
target-version = "py310"

[tool.ruff.format]

quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]

select = ["ANN", "D", "E", "F", "G", "I", "N", "PGH", "PLC", "PLE", "PLR", "PLW", "W"]

ignore = [
    "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "N812", "N817",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "PLW0603", "PLW2901",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]

"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]

known-first-party = ["telemetry", "tests"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]

convention = "google"
