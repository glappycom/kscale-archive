[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-camera-pi"
version = "0.1.0"
description = "LeRobot integration for Pi Camera"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "lerobot>=0.3.0",
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/yourusername/lerobot-hardware-integration"
Repository = "https://github.com/yourusername/lerobot-hardware-integration"
Issues = "https://github.com/yourusername/lerobot-hardware-integration/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_camera_pi*"]
